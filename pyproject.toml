[project]
name = "smart_kitchen_assistant"
version = "0.1.0"
description = "smart_kitchen_assistant using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.120.1,<1.0.0"
]

[project.scripts]
smart_kitchen_assistant = "smart_kitchen_assistant.main:run"
run_crew = "smart_kitchen_assistant.main:run"
train = "smart_kitchen_assistant.main:train"
replay = "smart_kitchen_assistant.main:replay"
test = "smart_kitchen_assistant.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
